name: Build Patched surfaceflinger

on:
  workflow_dispatch:
    inputs:
      AOSP_BRANCH:
        description: 'AOSP manifest branch'
        required: true
        default: 'android-13.0.0_r73'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    permissions:
      contents: write
    env:
      AOSP_BRANCH: ${{ inputs.AOSP_BRANCH || 'android-13.0.0_r73' }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        sudo rm -rf /usr/local/lib/android || true
        sudo rm -rf /usr/share/dotnet || true
        sudo rm -rf /opt/ghc || true
        sudo rm -rf /usr/local/share/boost || true
        sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
        sudo rm -rf /opt/hostedtoolcache || true
        sudo docker system prune -af || true
        df -h

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Install dependencies
      run: |
        sudo apt install -y git aria2 \
          bc bison flex gperf lib32z1-dev libc6-dev-i386 \
          libxml2-utils xsltproc fontconfig liblz4-tool lzop \
          squashfs-tools schedtool libreadline-dev lib32readline-dev \
          pngcrush imagemagick python3-all-dev

        wget -q http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb
        wget -q http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2_amd64.deb
        sudo dpkg -i libtinfo5_6.3-2_amd64.deb libncurses5_6.3-2_amd64.deb

        sudo curl --create-dirs -L -o /usr/local/bin/repo \
          https://storage.googleapis.com/git-repo-downloads/repo
        sudo chmod a+rx /usr/local/bin/repo

    - name: Initialize workspace
      run: |
        mkdir -p workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
      id: pwd

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Repo init AOSP
      run: |
        repo init -u https://android.googlesource.com/platform/manifest \
          -b ${{ env.AOSP_BRANCH }} --depth=1
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Add treble manifest
      run: |
        git clone https://github.com/TrebleDroid/treble_manifest \
          .repo/local_manifests \
          -b android-13.0
        rm -f .repo/local_manifests/replace.xml
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Sync source
      run: |
        SYNC_START=$(date +%s)
        repo sync -c --no-tags --no-clone-bundle \
          --force-sync -j$(nproc)
        SYNC_END=$(date +%s)
        SYNC_ELAPSED=$(( SYNC_END - SYNC_START ))
        echo "Sync time: $(( SYNC_ELAPSED / 3600 ))h $(( SYNC_ELAPSED % 3600 / 60 ))m $(( SYNC_ELAPSED % 60 ))s"
        echo "=== Disk after sync ==="
        df -h /home/runner/work
        echo "=== Source size ==="
        du -sh .
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Apply patches
      run: |
        git config --global user.email "runner@github.com"
        git config --global user.name "GitHub Runner"
        cd frameworks/native

        # Apply each patch individually
        for patch in \
          "${{ github.workspace }}/patches/0001-fix-wide-color-mode.patch" \
          "${{ github.workspace }}/patches/0002-fix-output-dataspace.patch" \
          "${{ github.workspace }}/patches/0003-fix-unknown-dataspace.patch"; do
          echo "=== Applying $(basename "$patch") ==="
          git am "$patch"
          git log --oneline -1
        done

        echo "=== All patches applied ==="
        git log --oneline -4
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Free disk after sync
      run: |
        echo "=== Disk before cleanup ==="
        df -h /home/runner/work
        du -sh .repo/
        rm -rf .repo
        echo "=== Disk after cleanup ==="
        df -h /home/runner/work
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Generate device config
      run: |
        cd device/phh/treble
        bash generate.sh
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Check resources before build
      run: |
        echo "=== Memory ==="
        free -h
        echo "=== Disk ==="
        df -h /home/runner/work
        echo "=== CPU ==="
        nproc
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Build surfaceflinger
      run: |
        (
          while true; do
            echo "$(date +%H:%M:%S) | MEM: $(free -h | awk '/Mem/{print $3"/"$2}') | SWAP: $(free -h | awk '/Swap/{print $3"/"$2}') | DISK: $(df -h /home/runner/work | awk 'NR==2{print $3"/"$2}') | PROCS: $(ps aux | grep -E 'ninja|clang|java' | grep -v grep | wc -l)"
            sleep 60
          done
        ) > /tmp/monitor.log 2>&1 &
        MONITOR_PID=$!

        . build/envsetup.sh
        lunch treble_arm64_bvN-userdebug

        BUILD_START=$(date +%s)
        echo "::group::Build started at $(date)"
        make WITHOUT_CHECK_API=true -j$(nproc) surfaceflinger 2>&1 | tee /tmp/build.log
        BUILD_EXIT=$?
        BUILD_END=$(date +%s)
        BUILD_ELAPSED=$(( BUILD_END - BUILD_START ))

        kill $MONITOR_PID 2>/dev/null || true

        echo "::endgroup::"
        echo "Build exit code: $BUILD_EXIT"
        echo "Build time: $(( BUILD_ELAPSED / 3600 ))h $(( BUILD_ELAPSED % 3600 / 60 ))m $(( BUILD_ELAPSED % 60 ))s"
        echo "::group::Resource usage during build"
        cat /tmp/monitor.log
        echo "::endgroup::"
        echo "::group::Last 50 lines of build log"
        tail -50 /tmp/build.log
        echo "::endgroup::"

        # Verify output exists
        SF_BIN="$(find out/target/product -path '*/system/bin/surfaceflinger' -type f | head -n 1)"
        if [ -z "$SF_BIN" ]; then
          echo "ERROR: surfaceflinger binary not found"
          find out/target/product -name "surfaceflinger" -type f 2>/dev/null
          exit 1
        fi

        echo "=== Binary info ==="
        file "$SF_BIN"
        ls -lh "$SF_BIN"
        md5sum "$SF_BIN"

        exit $BUILD_EXIT
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Package APatch module
      run: |
        MODULE_DIR="$GITHUB_WORKSPACE/frost-sf-colorfix-module"
        SF_BIN="$(find ${{ steps.pwd.outputs.workspace-folder }}/out/target/product -path '*/system/bin/surfaceflinger' -type f | head -n 1)"

        if [ -z "$SF_BIN" ]; then
          echo "ERROR: surfaceflinger binary not found"
          exit 1
        fi

        mkdir -p "$MODULE_DIR/system/bin"
        mkdir -p "$MODULE_DIR/system/etc/init"
        mkdir -p "$MODULE_DIR/META-INF/com/google/android"
        mkdir -p "$MODULE_DIR/system/bin/hw"

        cp "$SF_BIN" "$MODULE_DIR/system/bin/surfaceflinger"
        chmod 755 "$MODULE_DIR/system/bin/surfaceflinger"

        printf 'id=frost-sf-colorfix\nname=Frost SF Color Fix\nversion=v2\nversionCode=2\nauthor=truong0235\ndescription=Fixes camera green tint and video pink tint by patching SurfaceFlinger color pipeline\n' > "$MODULE_DIR/module.prop"

        printf '#!/system/bin/sh\nMODDIR=${0%%/*}\n\n# Apply SELinux rules for patched binary\nmagiskpolicy --live "allow init surfaceflinger_exec file { read open getattr execute execute_no_trans map }" "allow init surfaceflinger process transition sigchld" "allow init surfaceflinger process2 nosuid_transition" 2>/dev/null\n\n# Set properties for display color mode\nresetprop ro.surface_flinger.has_wide_color_display true 2>/dev/null\nresetprop persist.sys.sf.native_mode 2 2>/dev/null\nresetprop persist.sys.sf.color_mode 7 2>/dev/null\n\n# Set per-layer color correction for camera preview\n# Camera CCM from hi1337 sensor (rational[9] converted to float)\nresetprop persist.sys.sf.layer_pattern "opencamera" 2>/dev/null\nresetprop persist.sys.sf.layer_ccm "0.6094,-0.8203,-0.3125,0,0.0469,1.8359,0.6094,0,-0.1172,-0.0469,0.3125,0,0,0,0,1" 2>/dev/null\n' > "$MODULE_DIR/post-fs-data.sh"
        chmod 755 "$MODULE_DIR/post-fs-data.sh"

        printf 'ro.surface_flinger.has_wide_color_display=true\npersist.sys.sf.native_mode=2\npersist.sys.sf.color_mode=7\npersist.sys.sf.layer_pattern=opencamera\npersist.sys.sf.layer_ccm=0.6094,-0.8203,-0.3125,0,0.0469,1.8359,0.6094,0,-0.1172,-0.0469,0.3125,0,0,0,0,1\n' > "$MODULE_DIR/system.prop"

        printf '#!/system/bin/sh\nwhile [ "$(getprop sys.boot_completed)" != "1" ]; do\n  sleep 1\ndone\nsleep 5\nservice call SurfaceFlinger 1023 i32 2 i32 7 2>/dev/null\n' > "$MODULE_DIR/service.sh"
        chmod 755 "$MODULE_DIR/service.sh"

        printf '#!/sbin/sh\numask 022\nui_print() { echo "$1"; }\nrequire_new_magisk() {\n  ui_print " Please install Magisk v20.4+! "\n  exit 1\n}\nOUTFD=$2\nZIPFILE=$3\nmount /data 2>/dev/null\n[ -f /data/adb/magisk/util_functions.sh ] || require_new_magisk\n. /data/adb/magisk/util_functions.sh\n[ $MAGISK_VER_CODE -lt 20400 ] && require_new_magisk\ninstall_module\nexit 0\n' > "$MODULE_DIR/META-INF/com/google/android/update-binary"
        chmod 755 "$MODULE_DIR/META-INF/com/google/android/update-binary"

        printf '#MAGISK\n' > "$MODULE_DIR/META-INF/com/google/android/updater-script"

        printf '# Allow init to execute patched surfaceflinger (nosuid overlay mount)\nallow init surfaceflinger_exec file { read open getattr execute execute_no_trans map };\nallow init surfaceflinger process { transition sigchld };\nallow init surfaceflinger process2 nosuid_transition;\nallow surfaceflinger surfaceflinger_exec file { read open getattr execute map };\n' > "$MODULE_DIR/sepolicy.rule"

        cd "$MODULE_DIR"
        zip -r9 "$GITHUB_WORKSPACE/frost-sf-colorfix.zip" . -x ".*" -x "*/\.*"

        echo "=== Module zip created ==="
        ls -lh "$GITHUB_WORKSPACE/frost-sf-colorfix.zip"
        echo "=== Contents ==="
        unzip -l "$GITHUB_WORKSPACE/frost-sf-colorfix.zip"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Free disk and upload
      run: |
        echo "=== Disk before cleanup ==="
        df -h /home/runner/work
        rm -rf ${{ steps.pwd.outputs.workspace-folder }}/out
        rm -rf ${{ steps.pwd.outputs.workspace-folder }}
        echo "=== Disk after cleanup ==="
        df -h /home/runner/work

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          frost-sf-colorfix.zip
        name: SF-ColorFix-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          # Patched surfaceflinger for Poco C40 (frost)
          # Branch: ${{ env.AOSP_BRANCH }}
          # Fixes:
          # - isWideColorMode: SRGB counted as wide color for display mode selection
          # - composeSurfaces: outputDataspace always uses display color mode
          # - UNKNOWN dataspace override: vendor NV12 layers use BT.709 conversion
          # - Per-layer colorTransform: camera CCM applied via system property
          # Install via APatch/Magisk Manager
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
