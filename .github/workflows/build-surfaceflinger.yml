name: Build Patched surfaceflinger

on:
  workflow_dispatch:
  push:
    branches: [main]
    inputs:
      AOSP_BRANCH:
        description: 'AOSP manifest branch'
        required: true
        default: 'android-13.0.0_r51'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AOSP_BRANCH: ${{ inputs.AOSP_BRANCH || 'android-13.0.0_r51' }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        sudo rm -rf /usr/local/lib/android || true
        sudo rm -rf /usr/share/dotnet || true
        sudo rm -rf /opt/ghc || true
        sudo rm -rf /usr/local/share/boost || true
        sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
        sudo rm -rf /opt/hostedtoolcache || true
        sudo docker system prune -af || true
        df -h

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Install dependencies
      run: |
        sudo apt install -y git aria2 \
          bc bison flex gperf lib32z1-dev libc6-dev-i386 \
          libxml2-utils xsltproc fontconfig liblz4-tool lzop \
          squashfs-tools schedtool libreadline-dev lib32readline-dev \
          pngcrush imagemagick python3-all-dev

        wget -q http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb
        wget -q http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2_amd64.deb
        sudo dpkg -i libtinfo5_6.3-2_amd64.deb libncurses5_6.3-2_amd64.deb

        sudo curl --create-dirs -L -o /usr/local/bin/repo \
          https://storage.googleapis.com/git-repo-downloads/repo
        sudo chmod a+rx /usr/local/bin/repo

    - name: Initialize workspace
      run: |
        mkdir -p workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
      id: pwd

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 2

    - name: Repo init AOSP
      run: |
        repo init -u https://android.googlesource.com/platform/manifest \
          -b ${{ env.AOSP_BRANCH }} --depth=1
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Add treble manifest
      run: |
        git clone https://github.com/TrebleDroid/treble_manifest \
          .repo/local_manifests \
          -b android-13.0
        rm -f .repo/local_manifests/replace.xml
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Sync source
      run: |
        SYNC_START=$(date +%s)
        repo sync -c --no-tags --no-clone-bundle \
          --force-sync -j$(nproc)
        SYNC_END=$(date +%s)
        SYNC_ELAPSED=$(( SYNC_END - SYNC_START ))
        echo "Sync time: $(( SYNC_ELAPSED / 3600 ))h $(( SYNC_ELAPSED % 3600 / 60 ))m $(( SYNC_ELAPSED % 60 ))s"
        echo "=== Disk after sync ==="
        df -h /home/runner/work
        echo "=== Source size ==="
        du -sh .
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Apply patch
      run: |
        git config --global user.email "runner@github.com"
        git config --global user.name "GitHub Runner"
        PATCH_PATH="${{ github.workspace }}/patches/0001-fix-wide-color-mode.patch"
        echo "Looking for patch at: $PATCH_PATH"
        ls -la "$(dirname "$PATCH_PATH")"
        cd frameworks/native
        git am "$PATCH_PATH"
        echo "=== Patch applied ==="
        git log --oneline -1
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Free disk after sync
      run: |
        echo "=== Disk before cleanup ==="
        df -h /home/runner/work
        du -sh .repo/
        rm -rf .repo
        echo "=== Disk after cleanup ==="
        df -h /home/runner/work
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Generate device config
      run: |
        cd device/phh/treble
        bash generate.sh
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Check resources before build
      run: |
        echo "=== Memory ==="
        free -h
        echo "=== Disk ==="
        df -h /home/runner/work
        echo "=== CPU ==="
        nproc
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Build surfaceflinger
      run: |
        (
          while true; do
            echo "$(date +%H:%M:%S) | MEM: $(free -h | awk '/Mem/{print $3"/"$2}') | SWAP: $(free -h | awk '/Swap/{print $3"/"$2}') | DISK: $(df -h /home/runner/work | awk 'NR==2{print $3"/"$2}') | PROCS: $(ps aux | grep -E 'ninja|clang|java' | grep -v grep | wc -l)"
            sleep 60
          done
        ) > /tmp/monitor.log 2>&1 &
        MONITOR_PID=$!

        . build/envsetup.sh
        lunch treble_arm64_bvN-userdebug

        BUILD_START=$(date +%s)
        echo "::group::Build started at $(date)"
        make WITHOUT_CHECK_API=true -j$(nproc) surfaceflinger 2>&1 | tee /tmp/build.log
        BUILD_EXIT=$?
        BUILD_END=$(date +%s)
        BUILD_ELAPSED=$(( BUILD_END - BUILD_START ))

        kill $MONITOR_PID 2>/dev/null || true

        echo "::endgroup::"
        echo "Build exit code: $BUILD_EXIT"
        echo "Build time: $(( BUILD_ELAPSED / 3600 ))h $(( BUILD_ELAPSED % 3600 / 60 ))m $(( BUILD_ELAPSED % 60 ))s"
        echo "::group::Resource usage during build"
        cat /tmp/monitor.log
        echo "::endgroup::"
        echo "::group::Last 50 lines of build log"
        tail -50 /tmp/build.log
        echo "::endgroup::"

        # Verify output exists
        SF_BIN="out/target/product/phh_treble/system/bin/surfaceflinger"
        if [ ! -f "$SF_BIN" ]; then
          echo "ERROR: surfaceflinger binary not found at $SF_BIN"
          find out/target/product -name "surfaceflinger" -type f 2>/dev/null
          exit 1
        fi

        echo "=== Binary info ==="
        file "$SF_BIN"
        ls -lh "$SF_BIN"
        md5sum "$SF_BIN"

        exit $BUILD_EXIT
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Package APatch module
      run: |
        MODULE_DIR="$GITHUB_WORKSPACE/frost-sf-colorfix-module"
        SF_BIN="${{ steps.pwd.outputs.workspace-folder }}/out/target/product/phh_treble/system/bin/surfaceflinger"

        mkdir -p "$MODULE_DIR/system/bin"
        mkdir -p "$MODULE_DIR/system/etc/init"
        mkdir -p "$MODULE_DIR/META-INF/com/google/android"

        cp "$SF_BIN" "$MODULE_DIR/system/bin/surfaceflinger_patched"
        chmod 755 "$MODULE_DIR/system/bin/surfaceflinger_patched"

        printf 'id=frost-sf-colorfix\nname=Frost SF Color Fix\nversion=v1\nversionCode=1\nauthor=truong0235\ndescription=Fixes camera green tint by patching SurfaceFlinger to select SRGB color mode\n' > "$MODULE_DIR/module.prop"

        printf '#!/system/bin/sh\nMODDIR=${0%%/*}\n\nif [ -f /system/bin/surfaceflinger.bak ]; then\n  mount --bind /system/bin/surfaceflinger.bak /system/bin/surfaceflinger 2>/dev/null\nfi\n\nmount --bind "$MODDIR/system/bin/surfaceflinger_patched" /system/bin/surfaceflinger 2>/dev/null\n\nchcon u:object_r:surfaceflinger_exec:s0 /system/bin/surfaceflinger 2>/dev/null\n\nresetprop ro.surface_flinger.has_wide_color_display true 2>/dev/null\nresetprop persist.sys.sf.native_mode 2 2>/dev/null\nresetprop persist.sys.sf.color_mode 7 2>/dev/null\n' > "$MODULE_DIR/post-fs-data.sh"
        chmod 755 "$MODULE_DIR/post-fs-data.sh"

        printf 'ro.surface_flinger.has_wide_color_display=true\npersist.sys.sf.native_mode=2\npersist.sys.sf.color_mode=7\n' > "$MODULE_DIR/system.prop"

        printf '#!/system/bin/sh\nwhile [ "$(getprop sys.boot_completed)" != "1" ]; do\n  sleep 1\ndone\nsleep 5\nservice call SurfaceFlinger 1023 i32 2 i32 7 2>/dev/null\n' > "$MODULE_DIR/service.sh"
        chmod 755 "$MODULE_DIR/service.sh"

        printf '#!/sbin/sh\numask 022\nui_print() { echo "$1"; }\nrequire_new_magisk() {\n  ui_print " Please install Magisk v20.4+! "\n  exit 1\n}\nOUTFD=$2\nZIPFILE=$3\nmount /data 2>/dev/null\n[ -f /data/adb/magisk/util_functions.sh ] || require_new_magisk\n. /data/adb/magisk/util_functions.sh\n[ $MAGISK_VER_CODE -lt 20400 ] && require_new_magisk\ninstall_module\nexit 0\n' > "$MODULE_DIR/META-INF/com/google/android/update-binary"
        chmod 755 "$MODULE_DIR/META-INF/com/google/android/update-binary"

        printf '#MAGISK\n' > "$MODULE_DIR/META-INF/com/google/android/updater-script"

        cd "$MODULE_DIR"
        zip -r9 "$GITHUB_WORKSPACE/frost-sf-colorfix.zip" . -x ".*" -x "*/\.*"

        echo "=== Module zip created ==="
        ls -lh "$GITHUB_WORKSPACE/frost-sf-colorfix.zip"
        echo "=== Contents ==="
        unzip -l "$GITHUB_WORKSPACE/frost-sf-colorfix.zip"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Free disk and upload
      run: |
        echo "=== Disk before cleanup ==="
        df -h /home/runner/work
        rm -rf ${{ steps.pwd.outputs.workspace-folder }}/out
        rm -rf ${{ steps.pwd.outputs.workspace-folder }}
        echo "=== Disk after cleanup ==="
        df -h /home/runner/work

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          frost-sf-colorfix.zip
        name: SF-ColorFix-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          # Patched surfaceflinger for Poco C40 (frost)
          # Branch: ${{ env.AOSP_BRANCH }}
          # Fix: adds SRGB to isWideColorMode() for camera green tint
          # Install via APatch/Magisk Manager
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
